plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable

Metrics:
  Enabled: false

RSpec:
  Exclude:
    - spec/fixtures/**/*

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/SpecFilePathFormat:
  CustomTransform:
    CodeArtifact: codeartifact

Style/AccessModifierDeclarations:
  Enabled: true
  EnforcedStyle: inline
