name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  push:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: rubygems

    permissions:
      contents: read
      id-token: write

    env:
      BUNDLE_GEMFILE: release/Gemfile
      BUNDLE_FROZEN: 'true'
      RELEASE_TASKS_ONLY: 'true'

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.343.0
        with:
          ruby-version: ruby
          rubygems: latest
          bundler-cache: false # to prevent cache poisoning
      - name: Install dependencies
        run: bundle install --jobs 4
      - uses: rubygems/release-gem@v1.5.0
        with:
          owner: "175807" # nekketsuuu
